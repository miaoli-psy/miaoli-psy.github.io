# Site settings
title: Miao Li
SEOTitle: Miao Li | Miao personal website
header-img: img/bg.png
email: chuoli223@yahoo.com
description: "Miao's personal webpage"
keyword: "Miao"
url: "https://miaoli-psy.github.io/"
baseurl: ""

# Publish posts or collection documents with a future date.
future: true

# Top menu, in display order ("Home" is always first)
nav:
  - { title: About, url: /about/ }
  - { title: Publications, url: /publications/ }
  - { title: Research, url: /research/ }
  - { title: Blog, url: /archive/ }

# Social links (shown in sidebar and footer)
RSS: false
github_username: miaoli-psy
twitter_username: miaolipsy
linkedin_username: miaolipsy
researchgate_username: Li-L-Miao

# Build settings
highlighter: rouge
permalink: pretty
paginate: 10
exclude: ["README.md", "LICENSE", "Gemfile", "Gemfile.lock", "setup.sh"]
anchorjs: true # heading anchor links in blog posts

plugins: [jekyll-paginate]

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Sidebar settings
sidebar: true
sidebar-about-description: "Vision science follower; contact: chuoli223[at]hotmail.com"
sidebar-avatar: /img/miao_profile.jpg # absolute URL, used on both `/` and `/about/`

# Featured Tags
featured-tags: true
featured-condition-size: 1 # a tag is featured if it is used by more than this many posts

chrome-tab-theme-color: "#000000"

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false
