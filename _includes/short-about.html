<section class="visible-md visible-lg">
  <hr>
  <div class="short-about sidebar-profile">
    {% if site.sidebar-avatar %}
    <img src="{{ site.sidebar-avatar }}" alt="Portrait of {{ site.title }}" />
    {% endif %}
    <div class="sidebar-profile-details">
      {% if site.email %}
      <p class="sidebar-profile-contact"><a href="mailto:{{ site.email }}"><i class="fa fa-envelope-o" aria-hidden="true"></i> {{ site.email | replace: '@', '[at]' }}</a></p>
      {% endif %}
    </div>
    <!-- SNS Link -->
    {% include sns-links.html %}
  </div>
</section>

<style>
  .sidebar-profile-details {
    margin: 14px 0 18px;
  }
  .sidebar-profile-details p {
    margin: 0;
    line-height: 1.55;
  }
  .sidebar-profile-contact {
    margin-top: 7px !important;
    font-size: 13px;
  }
  .sidebar-container .sidebar-profile-contact a {
    color: #6e8b74 !important;
  }
  .sidebar-profile-contact .fa {
    width: 14px;
  }
</style>
